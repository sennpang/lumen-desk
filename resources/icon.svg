<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Lumen Desk 应用图标（设计方向 E：Lumen 字标）
       墨黑暖底 + 米白字母 L（竖笔即灯柱）+ 琥珀灯点。
       刻意不用渐变/光晕/星光等模板化装饰：小尺寸（Dock 16px）
       下只有强对比的几何笔画才清晰；琥珀圆点把 L 点成"亮着的灯"，
       完成 Lumen（光）的隐喻。 -->
  <rect x="48" y="48" width="928" height="928" rx="224" fill="#23201a"/>
  <!-- 极细内边框：徽标感，透明度极低避免缩小后显脏 -->
  <rect x="88" y="88" width="848" height="848" rx="190" fill="none"
        stroke="#f8f2e4" stroke-opacity=".14" stroke-width="4"/>
  <!-- 字母 L：圆头粗笔，竖笔同时是灯柱 -->
  <path d="M376,272 V684 Q376,714 406,714 H696"
        fill="none" stroke="#f8f2e4" stroke-width="112"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 灯：竖笔顶端的琥珀光点 -->
  <circle cx="376" cy="206" r="54" fill="#f59e0b"/>
</svg>
